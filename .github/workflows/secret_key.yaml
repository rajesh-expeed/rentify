name: secret key workflow
on: workflow_dispatch

jobs:
  secret_key_job:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Print secret key
        env:
          SECRET_KEY: ${{ secrets.SSO_CLIENT_KEY }}
        run: |
          echo "Secret Key: ${{ env.SECRET_KEY }}"
          echo "Secret: ${{ secrets.SSO_CLIENT_KEY }}"
