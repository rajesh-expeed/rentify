name: CICD
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-source-code
        uses: actions/checkout@v4
      - name: Login to Docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/rentify-docker:latest .
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/rentify-docker:latest

  deploy:
    needs: build
    runs-on: aws-ec2-rentify
    steps:
      - name: Pull docker image from Docker hub
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/rentify-docker:latest
      - name: Delete the old container
        run: docker rm -f rentify-container || true
      - name: Run the new container
        run: docker run -d -p 80:80 --restart unless-stopped --name rentify-container ${{ secrets.DOCKER_USERNAME }}/rentify-docker:latest
